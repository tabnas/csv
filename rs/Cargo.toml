[package]
name = "tabnas-csv"
version = "0.6.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "CSV (RFC 4180) grammar plugin for the tabnas parsing engine, over the jsonic base grammar"
repository = "https://github.com/tabnas/csv"

[lib]
name = "tabnas_csv"
path = "src/lib.rs"

[dependencies]
# The engine and the jsonic base grammar are consumed as SIBLING CHECKOUTS,
# the standard tabnas development model: clone https://github.com/tabnas/parser
# and https://github.com/tabnas/jsonic next to this repo. Both crates are on
# crates.io, but this committed manifest stays path-only (crates-release.yml
# rewrites the paths into crates.io requirements when it publishes), so
# there is no registry version to fall back on. jsonic in turn takes
# https://github.com/tabnas/json the same way.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
indexmap = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader and runner: the Rust half of @tabnas/support,
# another sibling checkout (https://github.com/tabnas/support). The
# `serde_json` feature is the bridge from the engine's `Value::to_json` to
# the runner's fixture value.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
